[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "networker-ppdm"
version = "3.3.0"
description = "Python clients and automation scripts for Dell EMC NetWorker, PPDM, and Data Domain"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "urllib3>=2.0",
    "typer>=0.12",
    "rich>=13.7",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",      # HTTP mock for requests
]
skill-tests = [
    "anthropic>=0.84",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ppdm*", "networker*", "datadomain*", "orchestrator*", "providers*", "rag*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-v --tb=short"
pythonpath = ["."]

[tool.coverage.run]
source = ["ppdm", "networker", "datadomain"]


[project.scripts]
backupctl = "orchestrator.cli:app"
