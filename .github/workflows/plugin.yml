name: Plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: these jobs only read the repo.
permissions:
  contents: read

jobs:
  validate:
    name: Validate Claude Code plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: claude plugin validate
        run: npx -y @anthropic-ai/claude-code@latest plugin validate .
