      - "MSSQL_AGENT"
      - "SAPHANA_AGENT"
      - "FS_AGENT"

  # ── PPDM DATABASE PROTECTION ──────────────────────────────────────────────

  - id: ppdm_oracle_policy
    category: PPDM Database
    section: PPDM Database Protection API
    prompt: "How do I create a PPDM protection policy for Oracle databases with RMAN and enable archive log backups?"
