      - "pointInTimeRecovery"
      - "recoveryTime"
      - "openDatabase"

  - id: ppdm_mssql_policy
    category: PPDM Database
    section: PPDM Database Protection API
    prompt: "How do I configure a PPDM protection policy for SQL Server with transaction log backups?"
    assertions:
