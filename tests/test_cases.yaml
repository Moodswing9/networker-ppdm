  # ── PPDM COPIES MANAGEMENT ────────────────────────────────────────────────

  - id: ppdm_retention_lock
    category: PPDM Copies
    section: PPDM Copies Management API
    prompt: "How do I apply a retention lock to a PPDM backup copy to prevent deletion until a specific date?"
