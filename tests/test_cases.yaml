---
# networker-ppdm skill test suite
# Each test case sends a prompt with the skill injected and validates the response
# contains all required assertions (case-insensitive substring match)

tests:

  # ── PPDM CORE ─────────────────────────────────────────────────────────────

  - id: ppdm_auth
    category: PPDM Core
    section: PPDM REST API
    prompt: "How do I authenticate to the PPDM REST API and use the token in subsequent requests?"
    assertions:
      - "8443"
      - "/api/v2/login"
      - "access_token"
      - "Bearer"
      - "Authorization"

  - id: ppdm_list_assets
    category: PPDM Core
    section: PPDM REST API
    prompt: "Show me the PPDM REST API call to list all assets and filter by asset type."
    assertions:
      - "/api/v2/assets"
      - "filter"
      - "type eq"
      - "Authorization"

  - id: ppdm_list_activities
    category: PPDM Core
    section: PPDM REST API
    prompt: "How do I retrieve all failed backup activities from the PPDM REST API?"
    assertions:
      - "/api/v2/activities"
      - "FAILED"
      - "filter"
      - "state"

  - id: ppdm_restore
    category: PPDM Core
    section: PPDM REST API
    prompt: "What is the PPDM REST API endpoint to initiate a restore and what body does it require?"
    assertions:
      - "/api/v2/restores"
      - "copyId"
      - "restoreType"
      - "POST"

  - id: ppdm_python_client
    category: PPDM Core
    section: Python Automation Library
    prompt: "Show me a reusable Python class for the PPDM API that handles authentication and listing failed activities."
    assertions:
      - "class PPDMClient"
      - "access_token"
      - "Bearer"
      - "failed"
      - "requests"

  - id: ppdm_powershell
    category: PPDM Core
    section: PowerShell Snippet
    prompt: "How do I trigger an on-demand PPDM backup using PowerShell?"
    assertions:
      - "Invoke-RestMethod"
      - "Bearer"
      - "protection-policies"
      - "token"

  # ── PPDM PROTECTION POLICIES ──────────────────────────────────────────────

  - id: ppdm_create_policy
    category: PPDM Policies
    section: PPDM REST API
    prompt: "How do I create a PPDM protection policy via REST API? Show the full JSON body."
    assertions:
      - "protection-policies"
      - "assetType"
      - "stages"
      - "retention"
      - "schedule"
      - "POST"

  - id: ppdm_protection_rules
    category: PPDM Policies
    section: PPDM REST API
    prompt: "How do I create a PPDM protection rule that automatically assigns assets to a policy?"
    assertions:
      - "protection-rules"
      - "conditions"
      - "MOVE_TO_POLICY"
      - "assetType"
      - "priority"

  # ── PPDM CREDENTIALS ──────────────────────────────────────────────────────

  - id: ppdm_credentials_crud
    category: PPDM Credentials
    section: Credentials API
    prompt: "Show me how to create, test, update and delete credentials in PPDM using the REST API."
    assertions:
      - "/api/v2/credentials"
      - "POST"
      - "PATCH"
      - "DELETE"
      - "test"
      - "username"
      - "password"

  # ── PPDM SLA & COMPLIANCE ─────────────────────────────────────────────────

  - id: ppdm_sla_compliance
    category: PPDM SLA
    section: SLA and Compliance API
    prompt: "How do I check SLA compliance in PPDM and list all non-compliant assets via REST?"
    assertions:
      - "/api/v2/slas"
      - "compliance"
      - "NON_COMPLIANT"
      - "rpoInSeconds"

  - id: ppdm_create_sla
    category: PPDM SLA
    section: SLA and Compliance API
    prompt: "How do I create a custom SLA with a 4-hour RPO in PPDM and assign it to a policy?"
    assertions:
      - "rpoInSeconds"
      - "14400"
      - "protection-policies"
      - "slaId"

  # ── PPDM ALERTS ───────────────────────────────────────────────────────────

  - id: ppdm_alerts
    category: PPDM Alerts
    section: Alerts and Events API
    prompt: "How do I list critical unacknowledged alerts and acknowledge them in bulk using PPDM REST API?"
    assertions:
      - "/api/v2/alerts"
      - "CRITICAL"
      - "UNACKNOWLEDGED"
      - "ACKNOWLEDGED"
      - "bulk"

  - id: ppdm_smtp
    category: PPDM Alerts
    section: Alerts and Events API
    prompt: "How do I configure SMTP email notifications for PPDM alerts via REST API?"
    assertions:
      - "smtp"
      - "email"
      - "recipients"
      - "severity"
      - "notification"

  - id: ppdm_audit_logs
    category: PPDM Alerts
    section: Alerts and Events API
    prompt: "How do I retrieve audit logs showing user actions and policy changes in PPDM?"
    assertions:
      - "audit"
      - "user"
      - "action"
      - "timestamp"

  # ── PPDM HEALTH & CERTS ───────────────────────────────────────────────────

  - id: ppdm_health
    category: PPDM System
    section: System Health and Certificates API
    prompt: "How do I check PPDM component health and manage certificates via the REST API?"
    assertions:
      - "components"
      - "certificates"
      - "status"
      - "notAfter"
      - "licenses"

  # ── PPDM USERS & RBAC ─────────────────────────────────────────────────────

  - id: ppdm_create_user
    category: PPDM RBAC
    section: PPDM Users and RBAC API
    prompt: "How do I create a new PPDM user with the Backup Administrator role using the REST API?"
    assertions:
      - "/api/v2/users"
      - "ROLE_BACKUP_ADMINISTRATOR"
      - "roleId"
      - "enabled"
      - "POST"

  - id: ppdm_roles_list
    category: PPDM RBAC
    section: PPDM Users and RBAC API
    prompt: "What built-in roles does PPDM have and how do I list them via REST?"
    assertions:
      - "ROLE_ADMIN"
      - "ROLE_BACKUP_ADMINISTRATOR"
      - "ROLE_RESTORE_ADMINISTRATOR"
      - "ROLE_USER"
      - "/api/v2/roles"

  - id: ppdm_sessions
    category: PPDM RBAC
    section: PPDM Users and RBAC API
    prompt: "How do I list active PPDM sessions and force logout a specific user?"
    assertions:
      - "/api/v2/sessions"
      - "loginTime"
      - "sourceIp"
      - "DELETE"

  # ── PPDM LDAP/AD ──────────────────────────────────────────────────────────

  - id: ppdm_ldap_configure
    category: PPDM LDAP
    section: PPDM LDAP / Active Directory Integration API
    prompt: "How do I configure Active Directory integration in PPDM and map an AD group to a role?"
    assertions:
      - "ldap-providers"
      - "ACTIVE_DIRECTORY"
      - "baseDn"
      - "bindDn"
      - "group-mappings"
      - "roleId"

  - id: ppdm_ldap_test
    category: PPDM LDAP
    section: PPDM LDAP / Active Directory Integration API
    prompt: "How do I test LDAP connectivity in PPDM after configuring a provider?"
    assertions:
      - "test"
      - "status"
      - "message"
      - "ldap"

  # ── PPDM APP HOST & AGENTS ────────────────────────────────────────────────

  - id: ppdm_register_host
    category: PPDM App Host
    section: PPDM App Host and Agent Registration API
    prompt: "What are the steps to register an application host in PPDM before protecting a database?"
    assertions:
      - "credentials"
      - "inventory-sources"
      - "HOST"
      - "discover"
